name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-assets:
    name: Validate game data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check WWTBAM.DAT, question banks, fonts and the hidden BMP
        run: python3 ci/validate_assets.py

  compile-qbasic:
    name: Compile reconstructed WWTBAM.BAS (QB64-PE)
    runs-on: ubuntu-latest
    env:
      QB64PE_VERSION: 4.5.0
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ mesa-common-dev libglu1-mesa-dev libasound2-dev libcurl4-openssl-dev
      - name: Cache QB64-PE
        id: cache-qb64pe
        uses: actions/cache@v4
        with:
          path: ~/qb64pe
          key: qb64pe-${{ env.QB64PE_VERSION }}-${{ runner.os }}
      - name: Build QB64-PE compiler
        if: steps.cache-qb64pe.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/qb64pe.tar.gz \
            "https://github.com/QB64-Phoenix-Edition/QB64pe/releases/download/v${QB64PE_VERSION}/qb64pe_lnx-${QB64PE_VERSION}.tar.gz"
          mkdir -p ~/qb64pe
          tar xzf /tmp/qb64pe.tar.gz -C ~/qb64pe --strip-components=1
          make -C ~/qb64pe -j"$(nproc)" OS=lnx BUILD_QB64=y
      - name: Compile src/WWTBAM.BAS
        run: |
          cd ~/qb64pe
          ./qb64pe -x "$GITHUB_WORKSPACE/src/WWTBAM.BAS" -o /tmp/wwtbam
          file /tmp/wwtbam

  dosbox-smoke:
    name: Boot original WWTBAM.EXE in DOSBox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DOSBox and headless X tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dosbox xvfb xdotool imagemagick unzip
      - name: Run smoke test
        run: ./ci/smoke_test.sh
